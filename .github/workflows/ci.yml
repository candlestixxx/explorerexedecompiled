name: Pipeline CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake mingw-w64

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Pipeline Mocks and Cross-Compilation Tests
        run: |
          chmod +x run_tests.sh test_mock_compilation.sh
          ./run_tests.sh
